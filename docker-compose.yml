services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Room for graceful shutdown to flush SQLite (forceExit timer fires at 5s).
    stop_grace_period: 15s
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=https://brawl.weeqlash.icu
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server/questions.enc:/app/server/questions.enc:ro
      - ./data:/app/server/data
  redis:
    image: redis:8.8-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save ""
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
