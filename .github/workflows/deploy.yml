name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential python3

      - run: npm ci

      - name: Lint
        run: npm run lint:all

      - name: Run tests
        env:
          QUESTIONS_KEY: ${{ secrets.QUESTIONS_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET_CI || 'test-secret-for-ci' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET_CI || 'test-admin-secret-for-ci' }}
          NODE_ENV: test
          REDIS_URL: redis://redis:6379
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run e2e tests
        env:
          QUESTIONS_KEY: ${{ secrets.QUESTIONS_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET_CI || 'test-secret-for-ci' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET_CI || 'test-admin-secret-for-ci' }}
          NODE_ENV: test
          REDIS_URL: redis://redis:6379
        run: npm run test:e2e

  deploy:
    name: Deploy to Server
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/weeqlash
            git pull origin main
            docker compose up -d --build
            docker image prune -f
            if ! diff -q /opt/weeqlash/Caddyfile /etc/caddy/Caddyfile >/dev/null 2>&1; then
              /usr/bin/caddy validate --config /opt/weeqlash/Caddyfile
              cp /opt/weeqlash/Caddyfile /etc/caddy/Caddyfile
              sudo systemctl restart caddy
            fi
